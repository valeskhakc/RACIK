name: Sync to Hugging Face Space

# Mirrors this repo's main branch to a Hugging Face Space on every push, so
# the deployed app tracks GitHub without a manual `git push` to the Space's
# own remote. Requires two repo secrets (Settings -> Secrets and variables
# -> Actions), set up per deploy/huggingface-spaces.md:
#   HF_TOKEN  - a Hugging Face access token with write access to the Space
#   HF_SPACE  - "your-username/your-space-name" (from the Space's URL)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a sync manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN and/or HF_SPACE repo secrets are not set — see deploy/huggingface-spaces.md" >&2
            exit 1
          fi
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push --force space HEAD:main
