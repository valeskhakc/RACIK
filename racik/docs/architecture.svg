    <rect x="465" y="464" width="47" height="38" class="chip" fill="#B7E4C7"/><text x="488.5" y="488">Hewani</text>
    <rect x="516" y="464" width="47" height="38" class="chip" fill="#B7E4C7"/><text x="539.5" y="488">Nabati</text>
    <rect x="567" y="464" width="42" height="38" class="chip" fill="#F8C8CE"/><text x="588" y="488">Sayur</text>
    <rect x="613" y="464" width="40" height="38" class="chip" fill="#F8C8CE"/><text x="633" y="488">Buah</text>
  </g>

  <!-- menu plan -> report -->
  <line x1="533" y1="522" x2="533" y2="596" class="flow"/>
  <text x="556" y="566" class="lbl">Compliance Analysis</text>

  <!-- ================= compliance & procurement report ================= -->
  <g transform="translate(533,678)">
    <circle cx="0" cy="0" r="76" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="7 7"/>
    <rect x="-36" y="-46" width="72" height="92" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
    <rect x="-15" y="-55" width="30" height="16" rx="4" fill="#2563EB"/>
    <path d="M-24,-20 l7,7 l14,-14" fill="none" stroke="#2563EB" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="-16" x2="26" y2="-16" class="ln" stroke="#2563EB"/>
    <path d="M-24,6 l7,7 l14,-14" fill="none" stroke="#2563EB" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="10" x2="26" y2="10" class="ln" stroke="#2563EB"/>
    <path d="M-24,32 l7,7 l14,-14" fill="none" stroke="#2563EB" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="36" x2="26" y2="36" class="ln" stroke="#2563EB"/>
    <circle cx="-62" cy="-34" r="15" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="-62" y="-29" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Rp</text>
    <circle cx="62" cy="40" r="15" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5"/>
    <path d="M56,40 q6,-11 12,-6 q-2,10 -12,6 z" fill="#2563EB"/>
    <circle cx="60" cy="-46" r="13" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5"/>
    <path d="M55,-46 l4,4 l7,-8" fill="none" stroke="#2563EB" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="533" y="792" class="cap" text-anchor="middle">Racik Compliance &amp;</text>
  <text x="533" y="814" class="cap" text-anchor="middle">Procurement Report</text>

