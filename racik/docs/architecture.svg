  <g transform="translate(925,642)">
    <path d="M0,14 V72 a56,15 0 0 0 112,0 V14" fill="#FFFFFF" class="blue"/>
    <ellipse cx="56" cy="14" rx="56" ry="15" fill="#FFFFFF" class="blue"/>
    <path d="M0,33 a56,15 0 0 0 112,0" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <path d="M0,53 a56,15 0 0 0 112,0" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="981" y="762" class="cap" text-anchor="middle">racik.db</text>
  <text x="981" y="783" class="note" text-anchor="middle">18.008 hidangan · 258rb baris bahan</text>

  <!-- database -> report -->
  <text x="790" y="656" class="lbl" text-anchor="middle">Nutrition &amp;</text>
  <text x="790" y="679" class="lbl" text-anchor="middle">Cost Facts</text>
  <line x1="919" y1="700" x2="640" y2="700" class="flow"/>

  <!-- data sources -> database -->
  <line x1="1112" y1="700" x2="1046" y2="700" class="flow"/>

  <!-- ================= data sources ================= -->
  <rect x="1118" y="552" width="420" height="256" class="grp"/>

  <rect x="1196" y="570" width="316" height="98" class="sub"/>
  <text x="1354" y="594" class="t" font-size="15" font-weight="bold" text-anchor="middle">Reference Standards</text>
  <text x="1214" y="618" class="bul">• AKG 2019 (Permenkes 28/2019)</text>
  <text x="1214" y="638" class="bul">• Isi Piringku (Permenkes 41/2014)</text>
  <text x="1214" y="658" class="bul">• MBG Rp10.000/porsi (BGN)</text>

  <rect x="1130" y="684" width="196" height="110" class="sub"/>
  <text x="1228" y="708" class="t" font-size="15" font-weight="bold" text-anchor="middle">Composition</text>
  <text x="1144" y="732" class="bul">• TKPI 2020</text>
  <text x="1144" y="752" class="bul">• 1.146 bahan pangan</text>
  <text x="1144" y="772" class="bul">• BDD + 22 zat gizi</text>

  <rect x="1338" y="684" width="188" height="110" class="sub"/>
  <text x="1432" y="708" class="t" font-size="15" font-weight="bold" text-anchor="middle">Price Data</text>
  <text x="1352" y="732" class="bul">• Bapanas snapshot</text>
  <text x="1352" y="752" class="bul">• BI PIHPS</text>
  <text x="1352" y="772" class="bul">• Indeks kemahalan</text>

  <text x="1328" y="838" class="lbl" text-anchor="middle">Food &amp; Price Data Source</text>

  <!-- ================= feedback loops to the operator ================= -->
  <!-- menu plan -> operator : choosing the menu -->
  <path d="M400,455 C300,430 170,400 118,322" class="flow"/>
  <text x="300" y="381" class="lbl" text-anchor="middle">Choosing Menu</text>

  <!-- report -> operator : answers -->
  <path d="M452,706 C260,760 100,700 96,330" class="flow"/>

  <!-- operator -> report : questions -->
  <path d="M70,336 C40,640 120,800 440,752" class="flow"/>
  <text x="170" y="548" class="lbl">Asking why a dish was</text>
  <text x="170" y="571" class="lbl">chosen, how to raise AKG</text>
  <text x="170" y="594" class="lbl">adequacy, what to buy</text>
</svg>
