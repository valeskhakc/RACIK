<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <style>
      .box   { fill:#FDF6BA; stroke:#111111; stroke-width:2.5; }
      .chip  { stroke:#111111; stroke-width:1.6; stroke-dasharray:4 3; }
      .grp   { fill:#FDF6BA; stroke:#111111; stroke-width:2.5; stroke-dasharray:7 5; }
      .sub   { fill:#FDF6BA; stroke:#111111; stroke-width:2; stroke-dasharray:5 4; }
      .flow  { stroke:#111111; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .t     { fill:#111111; }
      .lbl   { fill:#111111; font-size:17px; }
      .cap   { fill:#111111; font-size:18px; font-weight:bold; }
      .note  { fill:#3f3f46; font-size:13px; }
      .bul   { fill:#111111; font-size:13px; }
      .ln    { stroke:#1E3A8A; stroke-width:2.5; stroke-linecap:round; }
      .blue  { fill:none; stroke:#2563EB; stroke-width:3.5; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="800" y="78" class="t" font-size="42" font-weight="bold" text-anchor="middle">Architecture</text>

  <!-- ================= SPPG operator ================= -->
  <g>
    <circle cx="105" cy="178" r="33" fill="#F58220"/>
    <path d="M56,268 C56,214 154,214 154,268 Z" fill="#F58220"/>
    <text x="105" y="299" class="lbl" text-anchor="middle">SPPG Operator</text>
  </g>

  <!-- operator -> RACIK -->
  <text x="288" y="196" class="lbl" text-anchor="middle">Bahasa Indonesia</text>
  <text x="288" y="219" class="lbl" text-anchor="middle">(jenjang · porsi · pagu)</text>
  <line x1="172" y1="240" x2="392" y2="240" class="flow"/>

  <rect x="400" y="199" width="168" height="82" class="box"/>
  <text x="484" y="232" class="t" font-size="25" font-weight="bold" text-anchor="middle">RACIK</text>
  <text x="484" y="258" class="t" font-size="12.5" text-anchor="middle">SEA-LION orchestrator</text>

  <!-- SEA-LION model, feeding the orchestrator box -->
  <g transform="translate(447,80)">
    <rect x="0" y="0" width="74" height="52" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
    <circle cx="24" cy="21" r="5" fill="#2563EB"/><circle cx="50" cy="21" r="5" fill="#2563EB"/>
    <path d="M22,35 q15,11 30,0" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M14,0 v-9 M60,0 v-9" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="14" cy="-12" r="4" fill="#2563EB"/><circle cx="60" cy="-12" r="4" fill="#2563EB"/>
  </g>
  <text x="484" y="152" class="cap" font-size="14" text-anchor="middle">SEA-LION v4.5</text>
  <text x="484" y="171" class="note" font-size="11.5" text-anchor="middle">Qwen-27B-IT · function calling</text>

  <!-- RACIK -> candidate filter -->
  <text x="722" y="196" class="lbl" text-anchor="middle">Request Accessing</text>
  <text x="722" y="219" class="lbl" text-anchor="middle">Food &amp; Recipe Data</text>
  <line x1="574" y1="240" x2="866" y2="240" class="flow"/>

  <rect x="872" y="199" width="212" height="82" class="box"/>
  <text x="978" y="226" class="t" font-size="19" font-weight="bold" text-anchor="middle">Candidate Filter</text>
  <text x="978" y="246" class="note" font-size="11.5" text-anchor="middle">G1–G5 gerbang keras</text>
  <text x="978" y="262" class="note" font-size="11.5" text-anchor="middle">skor: gizi/rupiah ×</text>
  <text x="978" y="275" class="note" font-size="11.5" text-anchor="middle">daerah × mutu data</text>

  <!-- ================= recipe corpus (top right) ================= -->
  <g>
    <g transform="translate(1198,150)">
      <rect x="0" y="0" width="56" height="46" rx="4" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="2.5"/>
      <rect x="0" y="0" width="15" height="46" rx="4" fill="#1E3A8A"/>
      <line x1="24" y1="14" x2="47" y2="14" class="ln"/><line x1="24" y1="24" x2="47" y2="24" class="ln"/>
      <line x1="24" y1="34" x2="39" y2="34" class="ln"/>
    </g>
    <g transform="translate(1300,150)">
      <rect x="0" y="0" width="56" height="46" rx="4" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="2.5"/>
      <rect x="0" y="0" width="15" height="46" rx="4" fill="#1E3A8A"/>
      <line x1="24" y1="14" x2="47" y2="14" class="ln"/><line x1="24" y1="24" x2="47" y2="24" class="ln"/>
      <line x1="24" y1="34" x2="39" y2="34" class="ln"/>
    </g>
    <g transform="translate(1249,212)">
      <rect x="0" y="0" width="56" height="46" rx="4" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="2.5"/>
      <rect x="0" y="0" width="15" height="46" rx="4" fill="#1E3A8A"/>
      <line x1="24" y1="14" x2="47" y2="14" class="ln"/><line x1="24" y1="24" x2="47" y2="24" class="ln"/>
      <line x1="24" y1="34" x2="39" y2="34" class="ln"/>
    </g>
    <text x="1281" y="292" class="cap" text-anchor="middle">Regional Recipe Corpus</text>
    <text x="1281" y="311" class="note" text-anchor="middle">SUMBER · 18.133 resep mentah · 34 provinsi</text>
  </g>

