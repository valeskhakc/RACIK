  <g transform="translate(922,404)">
    <rect x="0" y="0" width="122" height="88" rx="7" class="blue" fill="#FFFFFF"/>
    <rect x="14" y="15" width="41" height="55" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <line x1="21" y1="27" x2="48" y2="27" class="ln" stroke="#2563EB"/>
    <line x1="21" y1="38" x2="48" y2="38" class="ln" stroke="#2563EB"/>
    <line x1="21" y1="49" x2="41" y2="49" class="ln" stroke="#2563EB"/>
    <rect x="63" y="15" width="41" height="55" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <line x1="70" y1="27" x2="97" y2="27" class="ln" stroke="#2563EB"/>
    <line x1="70" y1="38" x2="97" y2="38" class="ln" stroke="#2563EB"/>
    <path d="M52,88 V101 M70,88 V101" class="blue" stroke-width="3"/>
    <line x1="40" y1="103" x2="82" y2="103" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="74" r="25" fill="#FFFFFF" class="blue"/>
    <rect x="89" y="63" width="22" height="24" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <line x1="119" y1="93" x2="131" y2="105" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="983" y="540" class="cap" text-anchor="middle">Racik Nutrition &amp;</text>
  <text x="983" y="562" class="cap" text-anchor="middle">Cost Engine</text>

  <!-- engine -> menu plan -->
  <text x="783" y="418" class="lbl" text-anchor="middle">Generating Menu</text>
  <text x="783" y="441" class="lbl" text-anchor="middle">under CP-SAT</text>
  <line x1="912" y1="466" x2="668" y2="466" class="flow"/>

