  <line x1="1281" y1="326" x2="1281" y2="404" class="flow"/>
  <text x="1268" y="345" class="note" font-size="12" text-anchor="end">URT → gram</text>
  <text x="1268" y="362" class="note" font-size="12" text-anchor="end">TKPI + BDD</text>
  <text x="1268" y="379" class="note" font-size="12" text-anchor="end">harga Rp/kg</text>
  <text x="1268" y="396" class="note" font-size="12" text-anchor="end">klasifikasi slot</text>

  <!-- ================= costed dish index (by tray slot) ================= -->
  <rect x="1100" y="410" width="362" height="104" class="box"/>
  <text x="1281" y="437" class="t" font-size="18" font-weight="bold" text-anchor="middle">Costed Dish Index</text>
  <text x="1281" y="454" class="note" font-size="11" text-anchor="middle">18.008 hidangan berbiaya, per slot nampan</text>
  <g text-anchor="middle" class="t">
    <rect x="1107" y="462" width="66" height="42" class="chip" fill="#B7E4C7"/>
    <text x="1140" y="478" font-size="10">hewani</text><text x="1140" y="494" font-size="11" font-weight="bold">13.525</text>
    <rect x="1177" y="462" width="66" height="42" class="chip" fill="#B7E4C7"/>
    <text x="1210" y="478" font-size="10">nabati</text><text x="1210" y="494" font-size="11" font-weight="bold">3.051</text>
    <rect x="1247" y="462" width="66" height="42" class="chip" fill="#B7E4C7"/>
    <text x="1280" y="478" font-size="10">sayur</text><text x="1280" y="494" font-size="11" font-weight="bold">826</text>
    <rect x="1317" y="462" width="66" height="42" class="chip" fill="#F8C8CE"/>
    <text x="1350" y="478" font-size="10">pokok</text><text x="1350" y="494" font-size="11" font-weight="bold">429</text>
    <rect x="1387" y="462" width="66" height="42" class="chip" fill="#F8C8CE"/>
    <text x="1420" y="478" font-size="10">buah</text><text x="1420" y="494" font-size="11" font-weight="bold">177</text>
  </g>

  <!-- costed index -> engine -->
  <line x1="1094" y1="462" x2="1058" y2="462" class="flow"/>

